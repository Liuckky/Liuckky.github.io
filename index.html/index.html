<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L.N</title>
  <meta name="description" content="" id="descricao">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    (function () {
      var tema = "light";
      try { tema = localStorage.getItem("tema") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
      document.documentElement.setAttribute("data-bs-theme", tema);
    })();
  </script>
  <style>
:root {
  --papel: #e9ede3;
  --tinta: #14261f;
  --suave: #4d5f55;
  --verde: #0f5257;
  --mostarda: #f2c230;
  --linha: #b6c0b0;
  --titulo: "Archivo", system-ui, sans-serif;
  --texto: "Source Serif 4", Georgia, serif;
}

html { scroll-behavior: smooth; scroll-padding-top: 70px; }
body { font-family: var(--texto); font-size: 1.1rem; background: var(--papel); color: var(--tinta); line-height: 1.7; }
h1, h2 { font-family: var(--titulo); }
a { color: var(--verde); }
:focus-visible { outline: 3px solid var(--verde); outline-offset: 3px; }

.navbar { background: var(--papel); border-bottom: 2px solid var(--tinta); }
.navbar-brand { font-family: var(--titulo); font-weight: 800; font-stretch: 110%; color: var(--tinta); }
.navbar .nav-link { font-family: var(--titulo); font-weight: 600; color: var(--tinta); }
.navbar .nav-link:hover { text-decoration: underline; text-underline-offset: 6px; }
.navbar .nav-link.active { text-decoration: underline; text-decoration-color: var(--mostarda); text-decoration-thickness: 4px; text-underline-offset: 6px; }

.hero { padding: 9rem 0 5rem; }
.hero h1 { font-size: clamp(3.2rem, 10vw, 7.5rem); font-weight: 900; font-stretch: 125%; line-height: .92; letter-spacing: -0.03em; margin-bottom: 0; }

.ficha { background: var(--mostarda); border: 2px solid var(--tinta); box-shadow: 8px 8px 0 var(--verde); padding: 1.5rem 1.75rem; margin: 0; transform: rotate(-1.5deg); }
.ficha div { display: grid; grid-template-columns: 6.5rem 1fr; gap: .75rem; padding: .55rem 0; border-bottom: 1px solid rgba(20, 38, 31, .35); }
.ficha div:last-child { border-bottom: 0; }
.ficha dt { font-family: var(--titulo); font-weight: 700; font-size: .95rem; }
.ficha dd { margin: 0; line-height: 1.4; align-self: center; }

.section { padding: 4.5rem 0; border-top: 2px solid var(--tinta); }
.section h2 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 800; font-stretch: 112%; margin-bottom: 1.5rem; }
.prose p { margin-bottom: 1.1rem; }

.linha { display: grid; grid-template-columns: 5rem 1fr 13rem; gap: 1rem 2rem; padding: 1.4rem .75rem; border-top: 1px solid var(--linha); color: var(--tinta); text-decoration: none; transition: background .15s, padding-left .15s; }
.linha:last-child { border-bottom: 1px solid var(--linha); }
.linha:hover { background: var(--mostarda); padding-left: 1.5rem; color: var(--tinta); }
.linha .ano { font-family: var(--titulo); font-weight: 700; }
.linha h3 { font-family: var(--titulo); font-size: 1.35rem; font-weight: 800; margin: 0 0 .25rem; }
.linha p { margin: 0; color: var(--suave); }
.linha:hover p { color: var(--tinta); }
.linha .stack { font-size: .95rem; font-style: italic; }
@media (max-width: 767px) { .linha { grid-template-columns: 1fr; gap: .25rem; } }

.hab { display: grid; grid-template-columns: 9rem 1fr; gap: 1rem; padding: .8rem 0; border-top: 1px solid var(--linha); }
.hab dt { font-family: var(--titulo); font-weight: 700; }
.hab dd { margin: 0; }
@media (max-width: 575px) { .hab { grid-template-columns: 1fr; gap: .1rem; } }

.contato { background: var(--tinta); color: var(--papel); }
.contato a { color: var(--mostarda); }
.contact-list { list-style: none; padding: 0; margin: 0; }
.contact-list li { padding: .5rem 0; font-family: var(--titulo); font-weight: 700; font-size: clamp(1.4rem, 4vw, 2.4rem); overflow-wrap: anywhere; }

.footer { padding: 1.5rem 0; font-size: .95rem; color: var(--suave); border-top: 2px solid var(--tinta); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .linha { transition: none; }
}

[data-bs-theme="dark"] { --papel: #0f1a15; --tinta: #e7ece1; --suave: #a3b4a9; --verde: #5cc2c7; --linha: #2f4238; }
[data-bs-theme="dark"] .contato { background: #08100c; color: var(--tinta); }
.ficha, .ficha dt, .ficha dd { color: #14261f; }
.linha:hover, .linha:hover h3, .linha:hover p { color: #14261f; }
.tema { margin-left: 1rem; }
.tema button { background: none; border: 1.5px solid var(--tinta); border-radius: 4px; padding: .15rem .7rem; font-family: var(--titulo); font-weight: 600; color: var(--tinta); cursor: pointer; }
.tema button:hover { background: var(--mostarda); border-color: var(--mostarda); color: #14261f; }
@media (max-width: 991px) { .tema { margin: .5rem 0 0; } }

.idioma { display: flex; align-items: center; gap: .25rem; margin-left: 1rem; }
.idioma button { background: none; border: 0; padding: .25rem .4rem; font-family: var(--titulo); font-weight: 600; color: var(--suave); cursor: pointer; }
.idioma button:hover { color: var(--tinta); }
.idioma button[aria-pressed="true"] { color: var(--tinta); text-decoration: underline; text-decoration-color: var(--mostarda); text-decoration-thickness: 4px; text-underline-offset: 6px; }
.idioma span { color: var(--linha); }
@media (max-width: 991px) { .idioma { margin: .5rem 0 0; } }
  </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#menu" data-bs-offset="90" tabindex="0">

  <nav class="navbar navbar-expand-lg fixed-top" id="menu">
    <div class="container">
      <a class="navbar-brand" href="#inicio" id="marca">lucas nunes</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
              aria-controls="navLinks" aria-expanded="false" data-aria="menuAria">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navLinks">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="#sobre" data-i18n="menu.sobre"></a></li>
          <li class="nav-item"><a class="nav-link" href="#projetos" data-i18n="menu.projetos"></a></li>
          <li class="nav-item"><a class="nav-link" href="#habilidades" data-i18n="menu.habilidades"></a></li>
          <li class="nav-item"><a class="nav-link" href="#contato" data-i18n="menu.contato"></a></li>
          <li class="nav-item tema"><button type="button" id="botaoTema"></button></li>
          <li class="nav-item idioma" role="group" aria-label="Idioma / Language">
            <button type="button" data-lang="pt" aria-pressed="true">PT</button>
            <span aria-hidden="true">|</span>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <header id="inicio" class="hero">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-7">
          <h1 id="nome"></h1>
        </div>
        <div class="col-lg-5">
          <dl class="ficha" id="ficha"></dl>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="sobre" class="section">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-4"><h2 data-i18n="menu.sobre"></h2></div>
          <div class="col-lg-7 prose" id="textoSobre"></div>
        </div>
      </div>
    </section>

    <section id="projetos" class="section">
      <div class="container">
        <h2 data-i18n="menu.projetos"></h2>
        <div class="lista-projetos" id="listaProjetos"></div>
      </div>
    </section>

    <section id="habilidades" class="section">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-4"><h2 data-i18n="menu.habilidades"></h2></div>
          <div class="col-lg-8" id="listaHabilidades"></div>
        </div>
      </div>
    </section>

    <section id="contato" class="section contato">
      <div class="container">
        <h2 data-i18n="menu.contato"></h2>
        <ul class="contact-list" id="listaContato"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span id="rodape"></span>
      <a href="#inicio" data-i18n="topo"></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>

const comum = {
  nome: "L.N",
  projetos: [
    { ano: "2026", link: "https://github.com/Liuckky/projeto-oficina" },
    { ano: "2026", link: "https://github.com/Liuckky/Liuckky.github.io" }
  ],
  contato: [
    ["liuckyalt@gmail.com", "mailto:liuckyalt@gmail.com"],
    ["github.com/Liuckky", "https://github.com/Liuckky"]
  ]
};

const textos = {
  pt: {
    htmlLang: "pt-BR",
    descricao: "Portfólio de L.N: projetos, habilidades e contato.",
    menuAria: "Abrir menu",
    menu: { sobre: "Sobre", projetos: "Projetos", habilidades: "Habilidades", contato: "Contato" },
    topo: "Voltar ao topo",
    temaEscuro: "Escuro",
    temaClaro: "Claro",
    ficha: [
      ["Curso", "Ciência da Computação"],
      ["Instituição", "UDF (Universidade do Distrito Federal)"],
      ["Foco", "Banco de dados e web"],
      ["Cidade", "Brasília, DF"],
      ["Status", "Em busca do primeiro emprego"]
    ],
    sobre: [
      "Desde criança eu me divirto em computadores programando e utilizando robos/IAs.",
      "Aprendo de forma rapida. Estou aberto a estágios e quero aprender dentro de uma equipe profissional."
    ],
    projetos: [
      { titulo: "Oficina de veículos", descricao: "Modelo entidade-relacionamento, script SQL e consultas para controlar clientes, veículos e ordens de serviço.", stack: "SQL, modelagem ER" },
      { titulo: "Este portfólio", descricao: "Site responsivo feito à mão com HTML, CSS e JavaScript, publicado no GitHub Pages.", stack: "HTML, CSS, JavaScript, Bootstrap" }
    ],
    habilidades: [
      ["Banco de dados", "C, C++, SQL, MySQL, modelagem entidade-relacionamento"],
      ["Web", "HTML, CSS, JavaScript, Bootstrap"],
      ["Ferramentas", "Git, GitHub, VS Code"]
    ]
  },
  en: {
    htmlLang: "en",
    descricao: "L.N's portfolio: projects, skills and contact.",
    menuAria: "Toggle navigation",
    menu: { sobre: "About", projetos: "Projects", habilidades: "Skills", contato: "Contact" },
    topo: "Back to top",
    temaEscuro: "Dark",
    temaClaro: "Light",
    ficha: [
      ["Major", "Computer Science"],
      ["University", "UFD (University of Federal District)"],
      ["Focus", "Databases and web"],
      ["City", "Brasília, Brazil"],
      ["Status", "Looking for a first job"]
    ],
    sobre: [
      "Ever since I was a child, I’ve enjoyed myself on computers by programming and using robots/AIs.",
      "I learn quickly. I am open to internships and want to learn within a professional team."
    ],
    projetos: [
      { titulo: "Auto repair shop", descricao: "Entity-relationship model, SQL script and queries to manage customers, vehicles and service orders.", stack: "SQL, ER modeling" },
      { titulo: "This portfolio", descricao: "Responsive site handmade with HTML, CSS and JavaScript, published on GitHub Pages.", stack: "HTML, CSS, JavaScript, Bootstrap" }
    ],
    habilidades: [
      ["Databases", "C, C++, SQL, MySQL, entity-relationship modeling"],
      ["Web", "HTML, CSS, JavaScript, Bootstrap"],
      ["Tools", "Git, GitHub, VS Code"]
    ]
  }
};

const $ = id => document.getElementById(id);
const busca = (obj, caminho) => caminho.split(".").reduce((o, k) => o[k], obj);

const partes = comum.nome.split(" ");
$("nome").innerHTML = partes.length > 1 ? `${partes[0]}<br>${partes.slice(1).join(" ")}` : comum.nome;
$("marca").textContent = comum.nome.toLowerCase();

// Contato (igual nos dois idiomas)
$("listaContato").innerHTML = comum.contato
  .map(([texto, url]) => `<li><a href="${url}" target="_blank" rel="noopener">${texto}</a></li>`).join("");
$("rodape").textContent = `© ${new Date().getFullYear()} ${comum.nome}`;

let langAtual = "pt";
const temaAtual = () => document.documentElement.getAttribute("data-bs-theme") === "dark" ? "dark" : "light";

function rotuloTema() {
  const t = textos[langAtual];
  $("botaoTema").textContent = temaAtual() === "dark" ? t.temaClaro : t.temaEscuro;
}

function definirTema(tema, salvar = true) {
  document.documentElement.setAttribute("data-bs-theme", tema);
  $("menu").setAttribute("data-bs-theme", tema);
  rotuloTema();
  if (salvar) { try { localStorage.setItem("tema", tema); } catch (e) {} }
}

function aplicar(lang) {
  langAtual = lang;
  const t = textos[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = comum.nome;
  $("descricao").setAttribute("content", t.descricao);

  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = busca(t, el.dataset.i18n); });
  document.querySelectorAll("[data-aria]").forEach(el => { el.setAttribute("aria-label", t[el.dataset.aria]); });

  $("ficha").innerHTML = t.ficha.map(([campo, valor]) => `<div><dt>${campo}</dt><dd>${valor}</dd></div>`).join("");
  $("textoSobre").innerHTML = t.sobre.map(p => `<p>${p}</p>`).join("");
  $("listaProjetos").innerHTML = t.projetos.map((p, i) => `
    <a class="linha" href="${comum.projetos[i].link}" target="_blank" rel="noopener">
      <span class="ano">${comum.projetos[i].ano}</span>
      <div><h3>${p.titulo}</h3><p>${p.descricao}</p></div>
      <span class="stack">${p.stack}</span>
    </a>`).join("");
  $("listaHabilidades").innerHTML = `<dl class="m-0">${t.habilidades
    .map(([grupo, itens]) => `<div class="hab"><dt>${grupo}</dt><dd>${itens}</dd></div>`).join("")}</dl>`;

  document.querySelectorAll(".idioma button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  rotuloTema();
  try { localStorage.setItem("idioma", lang); } catch (e) {}
}

let inicial = (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en";
try { const salvo = localStorage.getItem("idioma"); if (textos[salvo]) inicial = salvo; } catch (e) {}
aplicar(inicial);
definirTema(temaAtual(), false);
$("botaoTema").addEventListener("click", () => definirTema(temaAtual() === "dark" ? "light" : "dark"));

document.querySelectorAll(".idioma button").forEach(b => b.addEventListener("click", () => aplicar(b.dataset.lang)));
  </script>
</body>
</html>
